[package]
name = "pendant-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Loopback HTTP bridge from Pendant to herdr"

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64 = "0.22"
getrandom = "0.3"
p256 = { version = "0.14", features = ["ecdsa"] }
futures-util.workspace = true
mime_guess.workspace = true
pendant-herdr = { path = "../pendant-herdr" }
pendant-web = { path = "../pendant-web" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite = "0.29"
tempfile.workspace = true
