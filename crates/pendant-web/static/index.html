<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pendant" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Pendant</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Shell chrome -->
  <header class="chrome-top">
    <div class="machine">
      <span class="dot" id="ts-dot" title="Tailscale / bridge health"></span>
      <span class="machine-name" id="machine-name">castle</span>
    </div>
    <div class="chrome-right">
      <span class="badge mock-badge" id="mock-badge" hidden>MOCK</span>
      <span class="badge poll-badge" id="poll-badge" hidden">live</span>
      <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">⟳</button>
    </div>
  </header>

  <!-- Routes -->
  <main id="route" class="route"></main>

  <!-- Bottom tab bar -->
  <nav class="tabbar">
    <button class="tab" data-route="agents" aria-label="Agents">
      <span class="tab-ico">▦</span><span class="tab-lbl">Agents</span>
      <span class="tab-dot needs-you" id="needs-you" hidden>•</span>
    </button>
    <button class="tab" data-route="worktrees" aria-label="Worktrees">
      <span class="tab-ico">⎇</span><span class="tab-lbl">Worktrees</span>
    </button>
    <button class="tab" data-route="inbox" aria-label="Inbox">
      <span class="tab-ico">◷</span><span class="tab-lbl">Inbox</span>
      <span class="tab-dot inbox-dot" id="inbox-dot" hidden>•</span>
    </button>
    <button class="tab" data-route="more" aria-label="More">
      <span class="tab-ico">≡</span><span class="tab-lbl">More</span>
    </button>
  </nav>

  <!-- Compose sheet (S2) -->
  <section class="sheet" id="compose-sheet" hidden>
    <div class="sheet-grip" id="compose-grip"></div>
    <textarea id="compose-text" placeholder="Send a prompt…" rows="3"></textarea>
    <div class="sheet-actions">
      <button id="compose-cancel" class="btn ghost">Cancel</button>
      <button id="compose-send" class="btn primary">Send</button>
    </div>
  </section>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
