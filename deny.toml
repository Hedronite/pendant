# Licenses already used by this workspace. Unknown git sources are denied.

[advisories]
yanked = "deny"
# Only unmaintained notices are ignored here, never a vulnerability.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained; transitive via nsh 0.5.0 (nsh-base highlight, syntect). Review at the next nsh upgrade." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; transitive via nsh 0.5.0 (nsh-core). Review at the next nsh upgrade." },
    # 2026-11-18: chrono unmaintained (no patched release); pulled in by nsh-base 0.5 (0.6 still depends on chrono). Remove when nsh-base drops chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no patched release. It is transitive via nsh-base 0.5.0; nsh-base 0.6.0 still depends on chrono. Remove when nsh-base drops chrono." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Hedronite/lapis-lattice"]
