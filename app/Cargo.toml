[package]
name = "pendant-app"
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Hedronite/pendant"
description = "Pendant's phone app"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The shell: nsh's Rust UI, its fetch and its runtime. Exact pins, because
# `nsh package` builds the runner against the CLI's own version (0.5.0).
nsh-core = "=0.5.0"
nsh-base = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The live WebSocket. nsh 0.5.0's own WebSocket is reachable from TSX only,
# so the app runs blocking tungstenite on one worker thread (no tokio), on
# the same 0.28 line nsh-core already uses, over rustls with ring and the
# webpki roots (the versions nsh-core's tree already carries).
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
log = "0.4"
# Device keys and signatures go over the wire as base64 (the bridge decodes STANDARD).
base64 = "0.22"

# The notes store is host-only until D1: the phone app has no Lapis link
# (SPEC-shell). CI still builds and tests it on the host.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Pinned to the Lapis v0.5.0 release merge (rusqlite 0.42, libsqlite3-sys 0.40;
# clears RUSTSEC-2026-0459). It still carries GOAL-mobile G0-G3. lapis-notes is
# publish = false, so both stay git deps at this exact rev, never a version.
lapis-lattice = { git = "https://github.com/Hedronite/lapis-lattice", rev = "42aa3b8dcdac51c684bd3cd4c3c6a5c3c17a9092" }
lapis-notes = { git = "https://github.com/Hedronite/lapis-lattice", rev = "42aa3b8dcdac51c684bd3cd4c3c6a5c3c17a9092" }

# NSURLIsExcludedFromBackupKey on the index directory (iOS, and macOS dev hosts).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSURL", "NSValue"] }

[dev-dependencies]
# Same major as lapis-lattice's, so it unifies: the tests read the index file.
rusqlite = "0.42"

# Its own workspace, apart from the bridge crates at the repo root.
[workspace]
